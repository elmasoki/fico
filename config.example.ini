; config.ini olarak kopyalayın (kurulum.bat bunu otomatik yapar).
; Ortam değişkenleri (ORACLE_PASSWORD vb.) bu dosyadaki değerleri ezer.

[oracle]
; Audit'i ve Siron tablolarını okuyabilen kullanıcı (örn. kendi DBA kullanıcınız).
; Siron kullanıcısının kendisi OLMAMALI, yoksa bu uygulamanın sorguları da audit'e karışır.
dsn = dbhost:1521/SIRONPDB
user = KULLANICI_ADINIZ
; Şifreyi buraya yazmak yerine:
;   - "python run.py --save-password" ile Windows Kimlik Yöneticisi'ne kaydedin, ya da
;   - ORACLE_PASSWORD ortam değişkenini kullanın, ya da
;   - boş bırakın; uygulama açılışta sorar.
password =
; Oracle 11g veya Native Network Encryption zorunluysa Instant Client yolu (thick mode):
; client_lib_dir = C:\oracle\instantclient_19_20
client_lib_dir =

[siron]
; Siron uygulamasının bağlandığı veritabanı kullanıcısı (audit edilen kullanıcı).
; Ek kullanıcılar (rapor, batch...) uygulamadaki Ayarlar sayfasından veya yakalama formundan eklenir.
db_user = SIRON
; Siron tablolarının bulunduğu şemalar, virgülle. İlki varsayılan şemadır (CURRENT_SCHEMA).
schemas = SIRON

[app]
; unified | traditional | aud$ | cursor_cache  (yakalama formunda yakalama başına da seçilebilir)
audit_source = unified
max_audit_rows = 20000
; ekranda gösterilen en fazla satır
max_result_rows = 500
query_timeout_sec = 60
; 12.1 queued-write modunda kayıtları diske yazdırır (AUDIT_ADMIN yoksa sessizce geçer)
flush_unified_on_stop = true
; Rapora eklenen sonuçlarda saklanacak satır sayısı
snapshot_rows = 50
; "Değer bul" her sorgunun sonucunda en fazla kaç satır tarar
finder_rows = 500
; "Değer bul" tablo taramasında bundan büyük tablolar (istenmedikçe) atlanır
big_table_rows = 2000000
; Tam CSV dışa aktarımında en fazla satır
max_export_rows = 1000000
; Profil çıkarırken bundan büyük tablolar örneklenir (SAMPLE)
profile_sample_rows = 200000
; Taşıma paketi veri çıkarmada tablo başına satır sınırı (0 = sınırsız)
extract_max_rows = 0
; Varsayılan renk teması: siron (mavi) | odea (Odeabank siyah · altın). Kullanıcı üst çubuktan değiştirebilir.
ui_theme = siron
; Tarih bindleri metin olarak geldiğinde gerekirse:
; nls_date_format = DD/MM/YYYY HH24:MI:SS
nls_date_format =
nls_timestamp_format =
sqlite_path = data/siron_tracer.db
export_dir = data/exports
log_dir = data/logs
host = 127.0.0.1
port = 5000
secret_key =

[privacy]
; Dışa aktarım ve raporlarda varsayılan maskeleme: sensitive (yalnız hassas kolonlar) | all | none
mask_default = sensitive
; Hassas kolon adı deseni (regex). Boşsa yerleşik desen: TCKN, IBAN, telefon, e-posta, ad-soyad, adres, doğum...
; sensitive_pattern = TCKN|IBAN|PHONE|EMAIL|FULL_NAME|ADDRESS
sensitive_pattern =
