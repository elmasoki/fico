; config.ini olarak kopyalayın. Ortam değişkenleri (ORACLE_PASSWORD vb.) bu dosyadaki değerleri ezer.

[oracle]
; Audit ve Siron tablolarını okuyacak AYRI kullanıcı (Siron kullanıcısının kendisi DEĞİL,
; yoksa bu uygulamanın sorguları da audit'e düşer). sql/01_reader_user.sql
dsn = dbhost:1521/SIRONPDB
user = SIRON_TRACER
; Şifreyi buraya yazmak yerine ORACLE_PASSWORD ortam değişkeni kullanabilirsiniz.
password =
; Oracle 11g veya Native Network Encryption zorunluysa Instant Client yolunu verin (thick mode):
; client_lib_dir = C:\oracle\instantclient_19_20
client_lib_dir =

[siron]
; Siron uygulamasının bağlandığı veritabanı kullanıcısı (audit edilen kullanıcı)
db_user = SIRON
; Siron tablolarının bulunduğu şemalar, virgülle. İlki sorgu çalıştırırken CURRENT_SCHEMA olur.
schemas = SIRON

[app]
; unified | traditional | aud$ | cursor_cache
;   unified      : 12c+ unified auditing (önerilen)   -> sql/02_unified_audit_on.sql
;   traditional  : DBA_AUDIT_TRAIL (SQL metni 2000 karakterde kesilir)
;   aud$         : SYS.AUD$ (traditional ama tam SQL metni)  -> sql/03_traditional_audit_on.sql
;   cursor_cache : audit gerektirmez, GV$SQL + GV$SQL_BIND_CAPTURE (bindler örneklenmiş)
audit_source = unified
max_audit_rows = 20000
max_result_rows = 500
query_timeout_sec = 60
; 12.1 queued-write modunda kayıtları diske yazdırır (AUDIT_ADMIN gerekir, yoksa sessizce geçer)
flush_unified_on_stop = true
; Tarih bindleri metin olarak geldiğinde gerekirse:
; nls_date_format = DD/MM/YYYY HH24:MI:SS
nls_date_format =
nls_timestamp_format =
sqlite_path = data/siron_tracer.db
host = 127.0.0.1
port = 5000
secret_key =
